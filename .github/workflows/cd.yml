name: Funda CD (Deploy)

# Self-hosted runner 운영 전제:
# - Azure VM 내부에 GitHub self-hosted runner가 실행 중이어야 합니다.
# - runner user가 docker group에 포함되어 있어야 합니다.
# - Azure VM에 Docker 및 Docker Compose plugin이 설치되어 있어야 합니다.
# - AZURE_VM_APP_DIR 경로에 이 repository가 clone되어 있어야 합니다.
# - repository가 private이라면 VM 내부 git 인증 설정이 필요합니다.

on:
  workflow_run:
    workflows: ['Funda CI (Build & Push)']
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    # CI 워크플로우가 성공적으로 끝났을 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      # 실제 self-hosted runner label에 맞게 조정하세요.
      - self-hosted
      - linux
      - x64
      - funda-prod
    steps:
      - name: deploy on self-hosted runner
        timeout-minutes: 30
        env:
          APP_DIR: ${{ secrets.AZURE_VM_APP_DIR }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV_BE_PROD: ${{ secrets.ENV_BE_PROD }}
        run: |
          set -euo pipefail

          if [ -z "${APP_DIR:-}" ]; then
            echo "AZURE_VM_APP_DIR secret is required."
            exit 1
          fi

          cd "$APP_DIR"

          # APP_DIR must already be a git repository cloned on the Azure VM.
          # If this repository is private, git authentication must be configured inside the VM.
          if [ ! -d .git ]; then
            echo "APP_DIR must be an existing git repository."
            exit 1
          fi

          git status --short --branch

          # 1. 최신 코드 가져오기 (배포 설정 파일 갱신) 배포용
          git pull --ff-only origin main

          # 2. .env 파일 생성 (루트 디렉토리)
          printf "ACR_LOGIN_SERVER=%s\nGRAFANA_ADMIN_PASSWORD=%s\nGRAFANA_ROOT_URL=%s\nSLACK_WEBHOOK_URL=%s\n" \
            "$ACR_LOGIN_SERVER" \
            "$GRAFANA_ADMIN_PASSWORD" \
            "$GRAFANA_ROOT_URL" \
            "$SLACK_WEBHOOK_URL" > .env

          # 3. BE 전용 환경 변수 주입
          mkdir -p apps/backend
          printf '%s' "$ENV_BE_PROD" > apps/backend/.env.production

          # 4. Azure Container Registry 로그인
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin

          # 5. 네트워크 및 공통 설정 준비
          docker network inspect funda-network >/dev/null 2>&1 || docker network create funda-network

          # 6. 실행 (애플리케이션)
          APP_COMPOSE=docker/production/docker-compose.deploy.yml
          # MONITOR_COMPOSE=docker/monitoring/docker-compose.monitoring.production.yml

          docker compose --env-file .env -f "$APP_COMPOSE" pull
          # docker compose --env-file .env -f "$MONITOR_COMPOSE" pull

          docker compose --env-file .env -f "$APP_COMPOSE" up -d --remove-orphans
          # docker compose --env-file .env -f "$MONITOR_COMPOSE" up -d

          # 7. DB 마이그레이션
          docker compose --env-file .env -f "$APP_COMPOSE" exec -T backend \
            node ./node_modules/typeorm/cli.js -d dist/config/typeorm.data-source.js migration:run

          # 7-1. 로드맵/필드 캐시 삭제
          docker compose --env-file .env -f "$APP_COMPOSE" exec -T redis sh -lc \
            "redis-cli --scan --pattern 'fields:*' | xargs -r redis-cli DEL"

          # 8. 정리
          docker image prune -f
