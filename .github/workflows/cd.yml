name: Funda CD (Deploy)

# Azure Run Command 기반 배포 운영 전제:
# - GitHub-hosted runner에서 azure/login으로 Azure에 로그인합니다.
# - Service Principal 권한 scope는 해당 resource group 또는 VM으로 제한하는 것을 권장합니다.
# - role 예시: Virtual Machine Contributor 또는 VM Run Command 실행에 필요한 더 제한된 custom role.
# - ACR pull은 VM 내부 docker login으로 처리하므로 workflow runner 쪽 ACR role은 필수 아닙니다.
# - Azure VM의 AZURE_VM_APP_DIR 경로에 이 repository가 clone되어 있어야 합니다.
# - repository가 private이라면 VM 내부에서 git pull이 가능하도록 인증 설정이 필요합니다.
# - Azure VM에 Docker 및 Docker Compose plugin이 설치되어 있어야 합니다.
# - cloudflared는 서비스 접근용이며 배포 실행에는 직접 관여하지 않습니다.

on:
  workflow_run:
    workflows: ['Funda CI (Build & Push)']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # 수동 실행은 바로 허용하고, CI 연동 자동 실행은 CI 성공 시에만 배포합니다.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create remote deployment script
        shell: bash
        env:
          APP_DIR: ${{ secrets.AZURE_VM_APP_DIR }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ENV_BE_PROD: ${{ secrets.ENV_BE_PROD }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name secret is required."
              exit 1
            fi
          }

          require_secret APP_DIR
          require_secret ACR_LOGIN_SERVER
          require_secret ACR_USERNAME
          require_secret ACR_PASSWORD
          require_secret ENV_BE_PROD

          encode_secret() {
            printf '%s' "$1" | base64 -w 0
          }

          APP_DIR_B64="$(encode_secret "$APP_DIR")"
          ACR_LOGIN_SERVER_B64="$(encode_secret "$ACR_LOGIN_SERVER")"
          ACR_USERNAME_B64="$(encode_secret "$ACR_USERNAME")"
          ACR_PASSWORD_B64="$(encode_secret "$ACR_PASSWORD")"
          ENV_BE_PROD_B64="$(encode_secret "$ENV_BE_PROD")"

          cat > deploy-remote.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          decode_secret() {
            printf '%s' "\$1" | base64 -d
          }

          APP_DIR="\$(decode_secret '$APP_DIR_B64')"
          ACR_LOGIN_SERVER="\$(decode_secret '$ACR_LOGIN_SERVER_B64')"
          ACR_USERNAME="\$(decode_secret '$ACR_USERNAME_B64')"
          ACR_PASSWORD="\$(decode_secret '$ACR_PASSWORD_B64')"
          ENV_BE_PROD="\$(decode_secret '$ENV_BE_PROD_B64')"

          echo "=== 1. Move to app dir ==="
          if [ -z "\${APP_DIR:-}" ]; then
            echo "AZURE_VM_APP_DIR secret is required."
            exit 1
          fi

          cd "\$APP_DIR"

          if [ ! -d .git ]; then
            echo "APP_DIR must be an existing git repository."
            exit 1
          fi

          git status --short --branch

          echo "=== 2. Git pull ==="
          git pull --ff-only origin main

          echo "=== 3. Write env files ==="
          printf "ACR_LOGIN_SERVER=%s\n" "\$ACR_LOGIN_SERVER" > .env

          mkdir -p apps/backend
          printf '%s' "\$ENV_BE_PROD" > apps/backend/.env.production

          echo "=== 4. ACR login ==="
          printf '%s' "\$ACR_PASSWORD" | docker login "\$ACR_LOGIN_SERVER" -u "\$ACR_USERNAME" --password-stdin

          echo "=== 5. Docker pull ==="
          docker network inspect funda-network >/dev/null 2>&1 || docker network create funda-network

          APP_COMPOSE=docker/production/docker-compose.deploy.yml

          docker compose --env-file .env -f "\$APP_COMPOSE" pull

          echo "=== 6. Docker up ==="
          docker compose --env-file .env -f "\$APP_COMPOSE" up -d --remove-orphans
          docker compose --env-file .env -f "\$APP_COMPOSE" ps

          echo "=== 7. Migration ==="
          if ! docker compose --env-file .env -f "\$APP_COMPOSE" ps --status running --services | grep -qx backend; then
            echo "backend container is not running. Current compose status:"
            docker compose --env-file .env -f "\$APP_COMPOSE" ps
            exit 1
          fi

          docker compose --env-file .env -f "\$APP_COMPOSE" exec -T backend \\
            node ./node_modules/typeorm/cli.js -d dist/config/typeorm.data-source.js migration:run

          echo "=== 8. Redis cache clear ==="
          if ! docker compose --env-file .env -f "\$APP_COMPOSE" ps --status running --services | grep -qx redis; then
            echo "redis container is not running. Current compose status:"
            docker compose --env-file .env -f "\$APP_COMPOSE" ps
            exit 1
          fi

          docker compose --env-file .env -f "\$APP_COMPOSE" exec -T redis sh -lc \\
            "redis-cli --scan --pattern 'fields:*' | xargs -r redis-cli DEL"

          echo "=== 9. Image prune ==="
          docker image prune -f

          echo "=== Deploy done ==="
          EOF

          chmod 600 deploy-remote.sh

      - name: Deploy via Azure Run Command
        uses: azure/cli@v2
        timeout-minutes: 30
        with:
          inlineScript: |
            set -euo pipefail

            az vm run-command invoke \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_VM_NAME }}" \
              --command-id RunShellScript \
              --scripts @deploy-remote.sh \
              --query "value[0].message" \
              -o tsv

      - name: Cleanup remote deployment script
        if: always()
        shell: bash
        run: |
          rm -f deploy-remote.sh
