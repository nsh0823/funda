services:
  redis:
    image: redis:alpine
    container_name: funda-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - default
      - funda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ${ACR_LOGIN_SERVER}/funda-backend:latest
    container_name: funda-backend
    env_file:
      - ../../apps/backend/.env.production
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - funda-network

  frontend:
    image: ${ACR_LOGIN_SERVER}/funda-frontend:latest
    container_name: funda-frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /root/funda-cert:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - funda-network

networks:
  funda-network:
    external: true

volumes:
  redis_data:
